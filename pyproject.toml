[project]
name = "harborline"
version = "0.1.0"
description = "Synthetic insurance-policy RAG assistant with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Mustafa" }]
dependencies = [
    "faiss-cpu>=1.9.0",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.27,<0.4",
    "langchain-core>=0.3.27,<0.4",
    "langchain-openai>=0.2.14,<0.4",
    "numpy>=2.0",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "ragas==0.4.3",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.45"]

[project.scripts]
harborline-eval = "harborline.eval.cli:main"
harborline-ask = "harborline.ask:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborline"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["harborline"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "ragas",
    "ragas.*",
    "psycopg",
    "psycopg.*",
    "pgvector",
    "pgvector.*",
    "yaml",
    "openai",
    "openai.*",
    "anthropic",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
